# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# The location of the backend.
# https://firebase.google.com/docs/app-hosting/locations

# Grant the service account the "AI Platform User" role to allow access to Gemini.
serviceAccount: !gcp/serviceAccount
  roles:
    - roles/aiplatform.user
    - roles/firebase.admin

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # Declare the secrets that will be available to your application
  # as environment variables. You must create these secrets in
  # Google Cloud Secret Manager.
  secrets:
    - secret: GEMINI_API_KEY
    - secret: NEXT_PUBLIC_FIREBASE_API_KEY
    - secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    - secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    - secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    - secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    - secret: NEXT_PUBLIC_FIREBASE_APP_ID    
    - secret: FIREBASE_STORAGE_BUCKET
    - secret: SMTP_HOST
    - secret: SMTP_PORT
    - secret: SMTP_USER    
    - secret: SMTP_PASS
    - secret: SENDER_EMAIL
    - secret: GOOGLE_APPLICATION_CREDENTIALS
    - secret: SENDGRID_API_KEY
env:
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
  - variable: FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET  
  - variable: SMTP_HOST
    secret: SMTP_HOST
  - variable: SMTP_PORT
    secret: SMTP_PORT
  - variable: SMTP_USER
    secret: SMTP_USER
  - variable: SMTP_PASS
    secret: SMTP_PASS
  - variable: SENDER_EMAIL
    secret: SENDER_EMAIL
  - variable: GOOGLE_APPLICATION_CREDENTIALS
    secret: GOOGLE_APPLICATION_CREDENTIALS
  - variable: SENDGRID_API_KEY
    secret: SENDGRID_API_KEY
    